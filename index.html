<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>피지컬 컴퓨팅 웨어러블 장치 설계하기 | 2학년 소프트웨어와 생활 | 1차 수행평가</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1b2333; --mute:#667085; --line:#e3e8f0; --brand:#2f5bea; --brand-d:#2347c4; --brand-l:#e8eefe;
  --ok:#12805c; --ok-l:#e3f6ee; --bad:#c2332b; --bad-l:#fdebea; --warn:#b26a00; --warn-l:#fff4e0;
  --code-bg:#0f172a; --code-ink:#e5eaf5; --code-mute:#7f8ba6; --blank:#fde68a;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.mono,.code,.pseudo,pre,.blank,.cons{font-family:"JetBrains Mono","D2Coding","Consolas","Menlo","Noto Sans Mono CJK KR","Malgun Gothic",monospace}

/* 로그인 */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:440px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:34px 30px}
.login .school{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.02em}
.login h1{margin:6px 0 4px;font-size:22px;line-height:1.35}
.login .sub{color:var(--mute);font-size:13px;margin-bottom:22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.fld input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
.fld input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.fld .hint{font-size:12px;color:var(--mute);margin-top:4px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;transition:.15s}
.btn:hover{background:var(--brand-d)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;padding:13px;font-size:16px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)} .btn.ghost:hover{background:#f3f5f9}
.btn.danger{background:var(--bad)} .btn.ok{background:var(--ok)} .btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;margin:10px 0}
.msg.err{background:var(--bad-l);color:var(--bad)} .msg.info{background:var(--brand-l);color:var(--brand-d)} .msg.warn{background:var(--warn-l);color:var(--warn)} .msg.ok{background:var(--ok-l);color:var(--ok)}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--mute)} .foot a{color:var(--mute)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#bbb}
.status-dot.on{background:var(--ok)} .status-dot.off{background:var(--bad)}

/* 시험 화면 */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:9px 18px}
.top .ttl{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{color:var(--mute);font-size:13px;white-space:nowrap}
.top .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:4px 12px;border-radius:999px;background:var(--brand-l);color:var(--brand-d)}
.timer.low{background:var(--warn-l);color:var(--warn)} .timer.crit{background:var(--bad-l);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.save{font-size:12px;color:var(--mute);white-space:nowrap} .save.bad{color:var(--bad);font-weight:700}
.layout{display:flex;gap:22px;max-width:1280px;margin:0 auto;padding:20px 18px 120px}
.side{width:200px;flex:none;position:sticky;top:66px;align-self:flex-start}
.side .box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px}
.side a{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:13.5px}
.side a:hover{background:#f1f4fa} .side a .c{font-size:12px;color:var(--mute)} .side a.done .c{color:var(--ok);font-weight:700}
.side .legend{font-size:12px;color:var(--mute);margin:10px 4px 2px}
.main{flex:1;min-width:0}
.prob{margin-bottom:26px;scroll-margin-top:70px}
.prob-h{background:linear-gradient(135deg,#1f3fae,#2f5bea);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:14px 20px}
.prob-h h2{margin:0;font-size:17px} .prob-h .intro{font-size:13.5px;opacity:.92;margin-top:3px}
.item{background:var(--card);padding:18px 20px;border:1px solid var(--line);border-top:0}
.item:last-child{border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow)}
.item-h{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.item-h .no{font-weight:800;color:var(--brand)}
.pts{font-size:12px;font-weight:700;background:var(--brand-l);color:var(--brand-d);padding:1px 9px;border-radius:999px}
.item p{margin:6px 0}
.item.unans{outline:2px solid var(--warn);outline-offset:-2px}
.bank{background:#f7f8fb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px}
.bank b{color:var(--brand-d);margin-right:4px}
.bank .bl{font-weight:700;color:var(--mute);margin-right:6px}
table.tb{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
table.tb th,table.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:middle}
table.tb th{background:#f4f6fb;font-weight:700}
.tb input[type=text],.tb select{width:100%;min-width:90px}
.in,select.in,textarea.in{padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;outline:none}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
textarea.in{width:100%;min-height:96px;resize:vertical;line-height:1.6}
.essay-part{margin:10px 0} .essay-part label{display:block;font-weight:600;margin-bottom:4px;font-size:14px}
.cnt{font-size:12px;color:var(--mute);text-align:right}

/* 코드 */
.code,.pseudo{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:12px 14px;margin:10px 0;overflow-x:auto;font-size:13.5px;line-height:1.75}
.pseudo{font-family:inherit;background:#f6f7fb;color:#20283b;border:1px solid var(--line);font-size:14px}
.code .ttl,.pseudo .ttl{font:700 12px/1 system-ui;color:var(--code-mute);margin-bottom:6px;display:block}
.pseudo .ttl{color:var(--mute)}
.ln{white-space:pre;display:block;min-height:1.75em}
.ln .cm{color:var(--code-mute)} .pseudo .ln .cm{color:var(--mute)}
.blank{background:var(--blank);color:#1a1a1a;border:0;border-bottom:2px solid #d9a400;border-radius:5px;padding:1px 6px;margin:0 2px;font-size:13px;line-height:1.5;outline:none;vertical-align:baseline;min-width:5.2ch}
.blank::placeholder{color:#8a6d00;opacity:.85}
.blank:focus{background:#fff4b8;box-shadow:0 0 0 2px #f0c000}
select.blank{padding:1px 4px;cursor:pointer}
.blank.bad{outline:2px solid var(--bad)} .blank.good{outline:2px solid var(--ok)}
.ref .blank-ro{background:#2b3a5e;color:#ffd978;border-radius:5px;padding:0 5px}
.ref .blank-ro.empty{color:#ff9f9f}

/* 시뮬레이터 */
.sim{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0 14px;overflow:hidden}
.sim-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;background:#f4f6fb;border-bottom:1px solid var(--line)}
.sim-bar .sp{flex:1}
.sim-bar select{padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.sim-state{font-size:12.5px;color:var(--mute)}
.sim-body{display:flex;flex-wrap:wrap;gap:16px;padding:12px}
.mb{width:150px;flex:none;text-align:center}
.mb .face{background:#1c2540;border-radius:18px;padding:14px 10px;box-shadow:inset 0 0 0 3px #2c3860}
.leds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 6px}
.led{aspect-ratio:1;border-radius:50%;background:#2a3355;transition:background .08s}
.mbtn{display:flex;justify-content:space-between;margin-top:10px}
.mbtn button{width:46px;height:46px;border-radius:50%;border:0;background:#e6ecff;font-weight:800;cursor:pointer;box-shadow:0 2px 0 #9fb0e8;user-select:none;touch-action:manipulation}
.mbtn button.down{transform:translateY(2px);box-shadow:none;background:#c9d6ff}
.marq{margin-top:8px;min-height:24px;background:#0b1020;color:#ff6b6b;border-radius:6px;font:700 13px/24px monospace;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ctl{flex:1;min-width:220px;display:flex;flex-direction:column;gap:7px}
.ctl .row{display:grid;grid-template-columns:128px 1fr 62px;gap:8px;align-items:center;font-size:12.5px}
.ctl .row label{color:var(--mute)}
.ctl input[type=range]{width:100%}
.ctl input[type=number]{width:62px;padding:3px 5px;border:1.5px solid var(--line);border-radius:6px}
.ctl .row2{display:flex;gap:8px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.cons{flex:1 1 100%;background:#0b1020;color:#cfe4ff;border-radius:10px;padding:9px 11px;font-size:12.5px;min-height:70px;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.cons .e{color:#ff8f8f} .cons .s{color:#9ad0ff}
.cons-in{display:flex;gap:6px;flex:1 1 100%}
.cons-in input{flex:1;padding:6px 9px;border:1.5px solid var(--line);border-radius:8px}
.radio-log{flex:1 1 100%;font-size:12px;color:var(--mute)} .radio-log b{color:var(--ink)}
.cnote{font-size:12px;color:var(--mute);padding:0 12px 10px}

/* 하단 제출 */
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;justify-content:center;align-items:center;z-index:15}
.bottom .info{color:var(--mute);font-size:13px}

/* 모달/토스트 */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:18px} .modal .body{font-size:14.5px;color:#2a3245}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111a2e;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:120;box-shadow:var(--shadow)}

/* 교사 화면 */
.t-wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.t-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.t-head h1{font-size:20px;margin:0;flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:13.5px}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;white-space:nowrap}
.tbl th{background:#f4f6fb;font-size:12.5px;color:var(--mute);position:sticky;top:0}
.tbl tr:hover td{background:#fafbff}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700}
.chip.g{background:var(--ok-l);color:var(--ok)} .chip.y{background:var(--warn-l);color:var(--warn)} .chip.r{background:var(--bad-l);color:var(--bad)} .chip.b{background:var(--brand-l);color:var(--brand-d)}
.scroll{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}
.ans-box{background:#f7f8fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px;margin:4px 0 8px}
.ans-box.empty{color:var(--mute);font-style:italic}
.rub{background:var(--warn-l);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0;color:#5a3d00}
.ge-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sw{position:relative;display:inline-block;width:46px;height:26px} .sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cbd2e0;border-radius:999px;cursor:pointer;transition:.2s} .sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)} .sw input:checked+span:before{transform:translateX(20px)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 14px;align-items:center;font-size:14px}
.kv label{font-weight:600}
.ok-t{color:var(--ok);font-weight:700} .bad-t{color:var(--bad);font-weight:700}
.cellres{display:inline-block;margin:2px 6px 2px 0;padding:2px 9px;border-radius:7px;font-size:13px;background:#f4f6fb}
.cellres.t{background:var(--ok-l);color:var(--ok)} .cellres.f{background:var(--bad-l);color:var(--bad)}
.cellres small{opacity:.8;margin-left:6px}

@media(max-width:900px){
  .side{display:none} .layout{padding:14px 10px 120px;gap:0} .top{padding:8px 10px;gap:8px} .top .who{display:none}
  .item{padding:14px 12px} .ctl .row{grid-template-columns:100px 1fr 58px}
  .login{padding:26px 20px}
}
@media print{.top,.bottom,.side{display:none}}

/* 수행평가 목록 */
.login.home{max-width:560px}
.rlist{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.rcard{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.rcard.off{background:#f7f8fb;opacity:.75}
.rcard .rno{font-size:12.5px;font-weight:800;color:var(--brand)} .rcard .rttl{font-size:17px;font-weight:800;margin:2px 0 6px}
.rcard .rstat{font-size:12.5px;color:var(--mute);min-height:20px;margin-bottom:8px}

/* 학생: 경고 배너 */
.warnbar{position:fixed;left:50%;top:64px;transform:translate(-50%,-20px);background:#c2332b;color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:130;box-shadow:0 8px 28px rgba(194,51,43,.4);opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.warnbar.show{opacity:1;transform:translate(-50%,0)}

/* 교사: 실시간 감독 */
.mon-wrap{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.mgrid.big{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))} .mgrid.big .mcard{font-size:15.5px}
.mcard{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--brand)}
.mcard.s-done{background:#f3faf6;border-color:#cfe9dc} .mcard.s-lost{background:var(--warn-l);border-color:#f0d49a}
.mcard.s-away{background:var(--bad-l);border-color:var(--bad)}
.mcard.flash{background:#ffe3e1;border-color:var(--bad);box-shadow:0 0 0 4px #c2332b33}
.mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap} .mh b{font-size:15px} .mno{font-size:11.5px;color:var(--mute)}
.mh .chip{margin-left:auto}
.mcur{font-size:13px;margin:5px 0 4px;font-weight:600;color:#2a3245}
.mbar{height:7px;background:#e8ecf4;border-radius:99px;overflow:hidden} .mbar i{display:block;height:100%;background:var(--brand)}
.mcard.s-done .mbar i{background:var(--ok)}
.mmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:5px}
.mmeta .sp{flex:1} .segs{display:flex;gap:3px}
.seg{display:block;width:18px;height:6px;background:#e0e5ef;border-radius:3px;overflow:hidden} .seg i{display:block;height:100%;background:#7a98f5}
.mchips{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap} .mago{font-size:11.5px;color:var(--mute);margin-left:auto}
.mlogp{position:sticky;top:12px;max-height:82vh;overflow:auto;margin:0}
.mlog .lg{border-top:1px solid var(--line);padding:7px 0;font-size:13px} .mlog .lg:first-child{border-top:0}
.mlog .lt{color:var(--mute);font-size:11.5px;margin-right:6px} .mlog .lno{color:var(--mute);font-size:11.5px;margin-left:6px}
.mlog .lg.leave .ltx,.mlog .lg.paste .ltx{color:var(--bad);font-weight:700} .mlog .lg.back .ltx{color:var(--mute)} .mlog .lg.done .ltx{color:var(--ok)}
@media(max-width:1000px){.mon-wrap{grid-template-columns:1fr}.mlogp{position:static;max-height:none}}

</style>
</head>
<body>
<div id="root"><div class="center"><div class="login">불러오는 중…</div></div></div>

"t":"bank","label":"보기","items":[["ㄱ","무한 반복하기"],["ㄴ","걸음 수를 1 증가시킨다"],["ㄷ","걸음 수가 목표 이상이다"],["ㄹ","반복 끝내기"],["ㅁ","걸음 수를 0으로 만든다"]]},{"t":"pseudo","lines":["걸음 수 = 0, 목표 = 10","{{㉠|sym}}","    만약 몸이 흔들리면","        {{㉡|sym}}","    만약 버튼 A가 눌리면","        걸음 수를 화면에 보여 주기","    만약 {{㉢|sym}} 이면","        하트 표시하기","        {{㉣|sym}}"]}]},{"id":"5-3","pts":2,"mode":"auto","blocks":[{"t":"p","text":"알고리즘을 코드로 옮겼다. ㉮~㉴에 알맞은 것을 쓰시오. ㉰은 +, −, ×, ÷ 중 하나이고, ㉳은 '이상'을 뜻하는 기호이다."},{"t":"code","run":{"sim":{"gesture":1,"btnA":1},"speed":1},"lines":["from microbit import *","steps = 0                                   # 걸음 수","GOAL = 10                                   # 목표 걸음 수","def {{㉮}}():                               # 걸음 수를 1 늘리는 함수 add_step","    {{㉯}} steps","    steps = steps {{㉰}} 1","while True:","    if accelerometer.current_gesture() == 'shake':   # 몸이 흔들리면(한 걸음)","        {{㉱}}","        sleep(500)","    if button_a.was_pressed():                   # 버튼 A를 누르면","        display.scroll({{㉲}})                   # 걸음수를 화면서 스크롤형태로 보여주기","    if steps {{㉳}} GOAL:","        display.show(Image.HEART)","        {{㉴}}                             # 반복 끝내기"]}]},{"id":"5-4","pts":2,"mode":"auto","blocks":[{"t":"p","text":"[코드 추적] 5-3의 완성된 코드에서 GOAL = 3으로 바꾸었다. while 문이 아래 표와 같이 반복될 때, 각 반복에서 화면에 나타나는 것을 쓰시오. 스크롤되는 숫자는 숫자만 쓰고, 하트가 표시되면 '하트', 아무것도 나타나지 않으면 '없음'이라고 쓴다. (steps의 처음 값은 0이다.)"},{"t":"ref","item":"5-3","title":"5-3에서 내가 완성한 코드 (GOAL = 3으로 바꿈, 읽기 전용)","replace":[["GOAL = 10","GOAL = 3"]]},{"t":"table","head":["반복","몸의 상태","버튼 A","화면에 나타나는 것"],"rows":[["1번째","흔들림","누르지 않음",{"c":"1","w":12}],["2번째","흔들림","누름",{"c":"2","w":12}],["3번째","흔들리지 않음","누름",{"c":"3","w":12}],["4번째","흔들림","누르지 않음",{"c":"4","w":12}]]}]},{"id":"5-5","pts":2,"mode":"teacher","blocks":[{"t":"p","text":"아래 프로그램은 add_step()을 처음 호출하는 순간 오류가 발생한다. 물음에 답하시오."},{"t":"essay","parts":[{"c":"가","label":"(가) 오류가 발생하는 이유를 '지역변수'와 '전역변수'라는 용어를 모두 사용하여 서술하시오."}]},{"t":"p","text":"(나) 오류가 나지 않도록 add_step 함수 안의 첫 줄에 넣어야 const PYRT = "import ast, asyncio, json, sys, types, traceback, builtins\nimport js\n\n# ───────── JS(시뮬레이터 화면)와 연결 ─────────\ndef _mb():\n    return getattr(js, '__mb')\n\nclass _Stop(BaseException):\n    \"\"\"사용자가 '정지'를 눌렀을 때\"\"\"\n\nclass _DryDone(BaseException):\n    \"\"\"오답 드라이런 한도 도달\"\"\"\n\nclass _Env:\n    dry = False\n    inputs = []\n    input_i = 0\n    ticks = 0\n    limit = 400\n    speed = 1.0\n    t0 = 0.0\n\nENV = _Env()\n\ndef _check_stop():\n    if _mb().stopped:\n        raise _Stop()\n\nasync def _tick():\n    ENV.ticks += 1\n    if ENV.dry:\n        if ENV.ticks > ENV.limit:\n            raise _DryDone()\n        return\n    _check_stop()\n    await asyncio.sleep(0)\n\nasync def _sleep_real(ms):\n    ms = max(0.0, float(ms)) / ENV.speed\n    left = ms / 1000.0\n    while left > 0:\n        step = min(left, 0.05)\n        await asyncio.sleep(step)\n        left -= step\n        _check_stop()\n\nasync def sleep(ms):\n    if ENV.dry:\n        await _tick()\n        return\n    ENV.ticks += 1\n    await _sleep_real(ms)\n\n# ───────── Image ─────────\nclass Image:\n    def __init__(self, s='00000:00000:00000:00000:00000'):\n        if isinstance(s, str):\n            rows = s.split(':')\n            self._rows = [[int(ch) if ch.isdigit() else 0 for ch in r.ljust(5, '0')[:5]] for r in rows[:5]]\n            while len(self._rows) \u003c 5:\n                self._rows.append([0] * 5)\n        else:\n            self._rows = [[0] * 5 for _ in range(5)]\n    def width(self): return 5\n    def height(self): return 5\n    def get_pixel(self, x, y): return self._rows[y][x]\n    def __str__(self): return ':'.join(''.join(str(v) for v in r) for r in self._rows)\n    __repr__ = __str__\n\nfor _n, _v in {\n    'HEART': '09090:99999:99999:09990:00900', 'HEART_SMALL': '00000:09090:09990:00900:00000',\n    'HAPPY': '00000:09090:00000:90009:09990', 'SMILE': '00000:00000:00000:90009:09990',\n    'SAD': '00000:09090:00000:09990:90009', 'YES': '00000:00009:00090:90900:09000',\n    'NO': '90009:09090:00900:09090:90009', 'ARROW_N': '00900:09990:90909:00900:00900',\n    'ARROW_S': '00900:00900:90909:09990:00900', 'ARROW_E': '00900:00090:99999:00090:00900',\n    'ARROW_W': '00900:09000:99999:09000:00900', 'SQUARE': '99999:90009:90009:90009:99999',\n    'SQUARE_SMALL': '00000:09990:09090:09990:00000', 'DIAMOND': '00900:09090:90009:09090:00900',\n    'CONFUSED': '00000:09090:00000:09090:90909', 'ANGRY': '90009:09090:00000:99999:90909',\n    'ASLEEP': '00000:99099:00000:09990:00000', 'SURPRISED': '09090:00000:00900:09090:00900',\n    'SILLY': '90009:00000:99999:00909:00999', 'FABULOUS': '99999:99099:00000:09090:09990',\n    'MEH': '09090:00000:00090:00900:09000', 'TRIANGLE': '00000:00900:09090:99999:00000',\n}.items():\n    setattr(Image, _n, Image(_v))\n\n# ───────── display ─────────\ndef _text_of(v):\n    if isinstance(v, float) and v == int(v) and abs(v) \u003c 1e15:\n        return str(v)\n    return str(v)\n\nclass _Display:\n    def __init__(self):\n        self._on = True\n        self._px = [[0] * 5 for _ in range(5)]\n    def _push(self):\n        if ENV.dry: return\n        _mb().led(':'.join(''.join(str(v) for v in r) for r in self._px))\n    def show(self, value, delay=400, *, wait=True, loop=False, clear=False):\n        if isinstance(value, Image):\n            self._px = [row[:] for row in value._rows]\n            if not ENV.dry: _mb().text('')\n            self._push()\n        elif isinstance(value, (list, tuple)):\n            for im in value:\n                self.show(im)\n        else:\n            t = _text_of(value)\n            self._px = [[0] * 5 for _ in range(5)]\n            self._push()\n            if not ENV.dry: _mb().text(t)\n    async def scroll(self, text, delay=150, *, wait=True, loop=False, monospace=False):\n        t = _text_of(text)\n        self._px = [[0] * 5 for _ in range(5)]\n        self._push()\n        if ENV.dry:\n            await _tick()\n            return\n        _mb().text(t)\ function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

/* ============ Supabase RPC ============ */
const API = {
  configured() { return !/YOUR-PROJECT|YOUR-ANON/.test(CONFIG.SUPABASE_URL + CONFIG.SUPABASE_ANON_KEY); },
  async rpc(fn, p, opt = {}) {
    const url = CONFIG.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/rpc/' + fn;
    const tries = opt.retries || 0;
    let lastErr;
    for (let i = 0; i <= tries; i++) {
      try {
        const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), opt.timeout || 20000);
        const res = await fetch(url, {
          method: 'POST', signal: ctl.signal,
          headers: Object.assign({ 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY }, /^eyJ/.test(CONFIG.SUPABASE_ANON_KEY) ? { Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON_KEY } : {}),   // 새 형식(sb_publishable_…) 키는 apikey 헤더만 사용
          body: JSON.stringify({ p: p || {} }),
        });
        clearTimeout(to);
        const text = await res.text(); let data; try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (!res.ok) {
          const msg = (data && (data.message || data.hint || data.error)) || ('서버 오류 ' + res.status);
          const e = new Error(msg); e.status = res.status; e.server = true; throw e;
        }
        return data;
      } catch (e) {
        lastErr = e;
        if (e.server) throw e;                // 서버가 답한 오류는 재시도하지 않음
        if (i < tries) await sleepMs(900 * (i + 1));
      }
    }
    const ne = new Error('NETWORK'); ne.network = true; ne.cause = lastErr; throw ne;
  },
};

  if (b.t === 'code' || b.t === 'pseudo') for (const l of b.lines) for (const m of l.matchAll(TOKEN_RE)) out.push(m[1]);

    window.addEventListener('mouseup', up); b.addEventListener('touchend', up); b.addEventListener('mouseleave', up);
    b.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') down(e); }); b.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') up(); });

  const mb = h('div', { class: 'mb' }, h('div', { class: 'face' }, h('div', { class: 'leds' }, leds)), (cfg.btnA || cfg.btnB) ? btnRow : null, marq);

  /* ----- 콘솔·라디오 ----- */
  const cons = h('div', { class: 'cons' });

  inBox.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitInput(); } });

  let radioLogEl = null, rInjectIn = null; const rlog = [];
  const radioBox = cfg.radio ? h('div', { class: 'radio-log' }) : null;
  if (cfg.radio) {
    radioLogEl = h('div', null, '📡 보낸 무선 메시지: (없음)');
    rInjectIn = h('input', { type: 'text', class: 'in', placeholder: '예: OK', style: { width: '110px' } });
    const inj = h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { if (rInjectIn.value) { st.inbox.push(rInjectIn.value); toast('수신함에 넣었습니다: ' + rInjectIn.value); rInjectIn.value = ''; } } }, '수신 메시지 넣기');
    radioBox.append(radioLogEl, h('div', { class: 'row2', style: { marginTop: '6px' } }, '📥 이 마이크로비트가 받을 메시지:', rInjectIn, inj));
  }
  function renderRadioLog() { if (!radioLogEl) return; radioLogEl.replaceChildren('📡 보낸 무선 메시지: ', ...(rlog.length ? rlog.map((r, i) => h('span', null, i ? ' · ' : '', h('b', null, r.m), r.n > 1 ? ` ×${r.n}` : '')) : ['(없음)'])); }
  function appendCons(text, cls) {
    const span = cls ? h('span', { class: cls }, text) : document.createTextNode(text);
    cons.append(span);
    while (cons.textContent.length > 12000 && cons.firstChild) cons.removeChild(cons.firstChild);
    cons.scrollTop = cons.scrollHeight;
  }

  /* ----- 상단 바 ----- */
  const status = h('span', { class: 'sim-state' }, '▶ 실행을 눌러 보세요');
  const speedSel = h('select', { title: '시간 흐름 속도(sleep 대기 시간 배속)' }, [[1, '속도 ×1'], [10, '×10'], [100, '×100'], [1000, '×1000']].map(([v, l]) => h('option', { value: v, selected: v === (cfg.speed || 1) }, l)));
  const runBtn = h('button', { class: 'btn sm', type: 'button' }, '▶ 실행');
  const stopBtn = h('button', { class: 'btn ghost sm', type: 'button', disabled: true }, '■ 정지');
  const bar = h('div', { class: 'sim-bar' }, runBtn, stopBtn, speedSel, h('span', { class: 'sp' }), status);
  const body = h('div', { class: 'sim-body' }, mb, ctl, radioBox, cons, inRow);
  const el = h('div', { class: 'sim' }, bar, body, h('div', { class: 'cnote' }, '※ 실제 마이크로비트가 아닌 연습용 시뮬레이터입니다. 슬라이더·버튼으로 센서 값을 바꿔 가며 실행하세요.'));

  /* ----- 파이썬이 호출하는 장치 인터페이스 ----- */
  sim.api = {
    get sound() { return els.sound ? els.sound.value : 0; },
    get temp() { return els.temp ? els.temp.value : 20; },
    get light() { return els.light ? els.light.value : 128; },
    get accx() { return els.accx ? els.accx.value : 0; },
    get accy() { return els.accy ? els.accy.value : 0; },
    get accz() { return -1024; },
    get gesture() { return Date.now() < st.shakeUntil ? 'shake' : (els.gesture ? els.gesture.value : 'face up'); },
    get stopped() { return st.stop; },
    led(s) { const rows = s.split(':'); for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) { const b = parseInt((rows[y] || '00000')[x] || '0', 10) || 0; leds[y * 5 + x].style.background = b ? `rgba(255,72,72,${(0.18 + 0.82 * b / 9).toFixed(2)})` : ''; } },
    text(t) { marq.textContent = t ? '🔤 ' + t : ''; },
    print(s) { appendCons(String(s)); },
    isPressed(k) { return !!st.held[k]; },
    wasPressed(k) { const v = !!st.latched[k]; st.latched[k] = false; return v; },
    getPresses(k) { const n = st.presses[k] || 0; st.presses[k] = 0; return n; },
    wasGesture() { return false; },
    now() { return Date.now() - st.t0; },
    radioConfig() {}, radioOn() {},
    radioSend(m) { const last = rlog[rlog.length - 1]; if (last && last.m === m) last.n++; else { rlog.push({ m, n: 1 }); if (rlog.length > 6) rlog.shift(); } if (!sim._rlt) sim._rlt = setTimeout(() => { sim._rlt = null; renderRadioLog(); }, 120); },
    radioRecv() { return st.inbox.length ? st.inbox.shift() : null; },
    input() { return new Promise((res) => { st.inRes = res; inRow.classList.remove('hide'); inBox.focus(); }); },
  };

  /* ----- 제어 함수 ----- */
  sim.el = el; sim.speedSel = speedSel; sim.runBtn = runBtn; sim.stopBtn = stopBtn;

  sim.print = (t) => appendCons(t); sim.printErr = (t) => appendCons(t + '\n', 'e');
  sim.stop = () => { st.stop = true; if (st.inRes) { const r = st.inRes; st.inRes = null; inRow.classList.add('hide'); r(''); } };
  sim.updateButtons = () => { runBtn.disabled = sim.running; stopBtn.disabled = !sim.running; };
  stopBtn.addEventListener('click', () => sim.stop());
  return sim;
}

/* 한 번 실행: 빈칸 정오 확인(서버) → 정답이면 그대로 실행, 오답이면 오류 표시 */
async function runBlock(sim, srcItem, srcBlock, runCfg) {
  if (sim.running) return;
  if (ACTIVE_SIM && ACTIVE_SIM !== sim && ACTIVE_SIM.running) { ACTIVE_SIM.stop(); for (let i = 0; i < 30 && ACTIVE_SIM.running; i++) await sleepMs(50); }
  sim.running = true; sim.updateButtons(); ACTIVE_SIM = sim;
  try {
    sim.reset(); sim.setStatus('준비 중…');
    let runFn;
    try { runFn = await ensurePy((m) => sim.setStatus(m)); }
    catch (e) { sim.printErr('파이썬 실행기를 불러오지 못했습니다.\n(인터넷 연결이나 학교 방화벽을 확인하세요. 답안 입력과 제출은 그대로 할 수 있습니다.)'); sim.setStatus('실행기 오류'); return; }
    const { code, offset } = buildProgram(srcItem, srcBlock, runCfg);
    const names = cellsOfBlock(srcBlock);
    let verdict = { all: true };
    const empties = names.filter((n) => !String(S.answers[srcItem.id + ':' + n] || '').trim());
    if (empties.length && S.feedback !== 'off') {
      verdict = { all: false, cells: S.feedback === 'hint' ? Object.fromEntries(empties.map((n) => [n, false])) : null };   // 빈칸이 있으면 서버 확인 없이 바로 오류 처리(확인 횟수 절약)
    } else if (names.length && S.feedback !== 'off' && S.token) {
      sim.setStatus('빈칸 확인 중…');
      const cells = {}; for (const n of names) cells[srcItem.id + ':' + n] = S.answers[srcItem.id + ':' + n] || '';
      try { verdict = await API.rpc('check_blanks', { token: S.token, item: srcItem.id, only: names, cells }, { retries: 1 }); }
      catch (e) { sim.printErr('서버와 연결하지 못해 코드를 확인할 수 없습니다. 잠시 뒤 다시 실행해 보세요.'); sim.setStatus('연결 오류'); return; }
      if (verdict.error) { sim.printErr(verdict.error); sim.setStatus('오류'); return; }
      if (verdict.submitted) { sim.printErr('이미 제출되었습니다.'); return; }
      if (verdict.limited) { sim.print('(빈칸 확인 횟수를 모두 사용했습니다. 입력한 코드를 그대로 실행합니다.)\n'); verdict = { all: true }; }
      else if (verdict.mode === 'off') verdict = { all: true };
      else if (typeof verdict.left === 'number') sim.setStatus(`확인 가능 횟수 ${verdict.left}회 남음`);
    }
    window.__mb = sim.api; sim.st.stop = false;
    if (!verdict.all) {
      sim.setStatus('확인 중…');
      const r = JSON.parse(await runFn(code, JSON.stringify({ dry: true, limit: 400, inputs: ['ex', 'exit', 'exotic'], offset, speed: 1 })));
      if (r.status === 'error') sim.printErr(r.message);
      else {
        let m = 'Traceback (most recent call last):\n  File "main.py"\nRuntimeError: 빈칸의 코드가 알고리즘과 맞지 않아 프로그램이 정상 동작하지 않습니다. 빈칸을 다시 확인하세요.';
        if (verdict.cells) { const bad = Object.entries(verdict.cells).filter(([, v]) => v === false).map(([k]) => k); if (bad.length) m += '\n(확인할 칸: ' + bad.join(', ') + ')'; }
        sim.printErr(m);
      }
      sim.setStatus('오류 발생');
      return;
    }
    sim.setStatus('실행 중…'); sim.print('');
    const r = JSON.parse(await runFn(code, JSON.stringify({ speed: +sim.speedSel.value || 1, offset })));
    if (r.status === 'error') { sim.printErr(r.message); sim.setStatus('오류 발생'); }
    else if (r.status === 'stopped') sim.setStatus('■ 정지됨');
    else sim.setStatus('✔ 프로그램이 끝났습니다');
  } catch (e) {
    sim.printErr('실행 중 문제가 발생했습니다: ' + (e && e.message ? e.message : e)); sim.setStatus('오류');
  } finally {
    sim.running = false; sim.updateButtons();
  }
}

/* ---------- 시험 시작/재개 ---------- */
function applyServerSession(r, keepLocal) {
  S.token = r.token; S.no = r.student_no; S.name = r.name; S.cls = r.class_no;
  S.feedback = r.run_feedback || 'error'; S.minutes = r.minutes;
  S.skew = Date.parse(r.server_now) - Date.now(); S.deadlineIso = r.deadline; S.deadline = Date.parse(r.deadline);
  const ans = Object.assign({}, r.answers || {});
  if (keepLocal) { for (const [k, v] of Object.entries(keepLocal)) if (v !== ans[k] && String(v || '') !== '') ans[k] = v; }
  S.answers = ans;
  S.leave = r.leave_count || 0; S.leaveLog = Array.isArray(r.leave_log) ? r.leave_log : []; S.paste = r.paste_count || 0;
}
function readLocalBackup(deadlineIso) {
  try { const o = JSON.parse(lsGet(lsKey()) || 'null'); if (o && o.deadline === deadlineIso && o.answers) return o.answers; } catch (e) { /* 무시 */ }
  return null;
}
async function beginExam(r) {
  S.submitted = false; S.submitting = false; S.dirty = false; S.warned = {}; S.sims = []; S.refreshers = [];
  const local = r.resumed ? readLocalBackup(r.deadline) : null;
  applyServerSession(r, local);
  if (local) S.dirty = true;
  renderExam();
  startStudentTimers();
  if (r.resumed) toast('이어서 풀기: 저장된 답안을 불러왔습니다.', 3200);
  if (S.dirty) saveNow();
  setTimeout(() => { ensurePy().catch(() => { /* 실행기 불러오기 실패는 실행 시 안내 */ }); }, 1500);
}

/* ---------- 문항 렌더링 ---------- */
function cellId(item, name) { return item.id + ':' + name; }
function getAns(id) { return S.answers[id] || ''; }

function setAns(id, v) {
  S.answers[id] = v; S.dirty = true;
  scheduleLocal(); scheduleSave();
  S.refreshers.forEach((f) => f());
  updateProgress();
  const it = document.getElementById('it-' + id.split(':')[0]); if (it) it.classList.remove('unans');
}
let _lt = null;
function scheduleLocal() {
  clearTimeout(_lt);
  _lt = setTimeout(() => { lsSet(lsKey(), JSON.stringify({ deadline: S.deadlineIso, answers: S.answers, t: Date.now() })); }, 300);
}

function cellNode(item, name, selName, opt = {}) {
  const id = cellId(item, name);
  if (selName && selName !== 'q') {
    const sel = h('select', { class: opt.table ? 'in' : 'blank', 'data-cell': id, 'aria-label': name });
    sel.append(h('option', { value: '' }, opt.table ? '선택' : '▾ ' + name));
    for (const [v, label] of selOptions(item, selName)) sel.append(h('option', { value: v }, label));

/* 한 줄 → 노드들 (텍스트 + {{칸|종류}}) */
function lineNodes(line, mk) {

}
function commentIndex(line) {

}

  return h('span', { class: 'ln' }, lineNodes(line.slice(0, ci), mk), h('span', { class: 'cm' }, lineNodes(line.slice(ci), mk)));

/* ---------- 저장 ---------- */
function setSaveUI(t, bad) { if (!S.saveEl) return; S.saveEl.textContent = t; S.saveEl.classList.toggle('bad', !!bad); }
let _st = null;
function scheduleSave() { clearTimeout(_st); _st = setTimeout(saveNow, 1500); if (S.saveEl && !S.saving) setSaveUI('저장 대기…'); }
function presencePayload() {
  return { item: S.cur || '', cell: S.curCell || '', away: !!(leaveAt && leaveAt.counted), away_ms: leaveAt && leaveAt.counted ? Date.now() - leaveAt.t : 0 };
}
async function saveNow() {
  if (!live() || S.submitting) return;
  if (S.saving) { S.again = true; return; }
  S.saving = true; S.again = false; const snap = JSON.stringify(S.answers);
  try {
    const r = await API.rpc('save_progress', { token: S.token, answers: S.answers, leave_count: S.leave, paste_count: S.paste, leave_log: S.leaveLog, presence: presencePayload() }, { retries: 1 });
    if (r.error) { await handleSessionError(r.error); return; }
    if (r.submitted) { onServerSubmitted(r.timeout ? '응시 시간이 끝나 자동 제출되었습니다.' : '제출이 완료되었습니다.'); return; }
    if (r.server_now) S.skew = Date.parse(r.server_now) - Date.now();
    S.dirty = JSON.stringify(S.answers) !== snap;
    setSaveUI('저장됨 ' + hhmmss(new Date()));
  } catch (e) {
    setSaveUI(e.network ? '저장 실패: 연결 확인 (자동 재시도)' : '저장 오류: ' + e.message, true);
  } finally {

  }
}
/* 답안이 그대로일 때는 가벼운 상태 알림만 보냄 (교사 감독 화면용 + 연결 유지) */
async function heartbeat() {
  if (!live() || S.submitting) return;
  if (S.dirty || S.saving) { saveNow(); return; }
  try {
    const r = await API.rpc('ping', { token: S.token, leave_count: S.leave, paste_count: S.paste, presence: presencePayload() }, { retries: 0, timeout: 10000 });
    if (r.error) { await handleSessionError(r.error); return; }
    if (r.submitted) { onServerSubmitted(r.timeout ? '응시 시간이 끝나 자동 제출되었습니다.' : '제출이 완료되었습니다.'); return; }
    if (r.server_now) S.skew = Date.parse(r.server_now) - Date.now();
  } catch (e) { setSaveUI('연결 확인 중…', true); }
}
async function handleSessionError(msg) {
  if (!/만료/.test(msg) || S.relogging) { setSaveUI(msg, true); return; }
  S.relogging = true;
  try {
    const r = await API.rpc('start_exam', { student_no: S.no, name: S.name, code: S.code }, { retries: 1 });
    if (r.error) { stopStudentTimers(); S.token = null; renderLogin(r.error); return; }
    if (!r.resumed) {   // 선생님이 초기화한 경우: 새 응시로 시작
      lsSet(lsKey(), ''); S.warned = {};
      applyServerSession(r, null); S.dirty = false; renderExam(); toast('선생님이 응시 기록을 초기화했습니다. 새로 시작합니다.', 4000);
    } else {
      const keep = Object.assign({}, S.answers);
      applyServerSession(r, keep); S.dirty = true; setSaveUI('다시 연결됨');
    }
  } catch (e) { setSaveUI('재연결 실패', true); } finally { S.relogging = false; }
}

/* ---------- 타이머 · 이탈 기록 ---------- */
function remainingMs() { return S.deadline - (Date.now() + S.skew); }
function fmtRemain(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)); const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return (hh ? hh + ':' + pad2(mm) : pad2(mm)) + ':' + pad2(ss);
}
function updateTimer() {
  if (!S.timerEl) return;
  const ms = remainingMs();
  S.timerEl.textContent = fmtRemain(ms);
  S.timerEl.classList.toggle('low', ms < 600000 && ms >= 180000);
  S.timerEl.classList.toggle('crit', ms < 180000);
  for (const m of [10, 5, 1]) if (ms <= m * 60000 && !S.warned[m] && ms > 0) { S.warned[m] = 1; toast(`남은 시간 ${m}분`, 3500); }
  if (ms <= 0 && live() && !S.submitting) doSubmit('timeout');
}
let leaveAt = null;
function trimLog() { if (S.leaveLog.length > 280) S.leaveLog = S.leaveLog.slice(-280); }
function countLeave() {
  if (!leaveAt || leaveAt.counted || !live()) return;
  leaveAt.counted = true; S.leave++;
  leaveAt.entry = { t: new Date(leaveAt.t).toISOString(), k: leaveAt.kind }; S.leaveLog.push(leaveAt.entry); trimLog(); saveNow();
}
function startLeave(kind) {
  if (!live()) return;
  if (leaveAt) { if (kind === 'hidden' && !leaveAt.counted) { leaveAt.kind = 'hidden'; clearTimeout(leaveAt.timer); countLeave(); } return; }
  leaveAt = { t: Date.now(), kind, counted: false };
  if (kind === 'hidden') countLeave(); else leaveAt.timer = setTimeout(countLeave, 1200);
}
function endLeave() {

  if (was.counted && was.entry) { was.entry.ms = Date.now() - was.t; saveNow(); warnBar(`⚠ 시험 화면을 벗어났습니다. (${Math.max(1, Math.round(was.entry.ms / 1000))}초) 이 기록은 선생님께 전달됩니다. 누적 ${S.leave}회`); }
}
function onPaste(e) {
  if (!live()) return;
  const t = e.target; if (!t || !t.dataset || !t.dataset.cell) return;
  const txt = (e.type === 'drop' ? (e.dataTransfer && e.dataTransfer.getData('text')) : (e.clipboardData && e.clipboardData.getData('text'))) || '';
  S.leaveLog.push({ t: new Date().toISOString(), k: e.type === 'drop' ? 'drop' : 'paste', cell: t.dataset.cell, n: txt.length }); trimLog();
  S.paste++; saveNow();
  warnBar('⚠ 붙여넣기가 감지되었습니다. 이 기록은 선생님께 전달됩니다. (누적 ' + S.paste + '회)');
}
function onFocusIn(e) {
  const t = e.target; if (!t || !t.closest) return;
  const it = t.closest('.item'); if (!it) return;
  const id = it.id.replace(/^it-/, ''); const cell = (t.dataset && t.dataset.cell) || '';
  if (id !== S.cur || cell !== S.curCell) { S.cur = id; S.curCell = cell; scheduleSave(); }
}
let _wb = null;
function warnBar(msg) {
  let el = document.getElementById('warnbar');
  if (!el) { el = h('div', { id: 'warnbar', class: 'warnbar', role: 'alert' }); document.body.append(el); }
  el.textContent = msg; el.classList.add('show'); clearTimeout(_wb); _wb = setTimeout(() => el.classList.remove('show'), 9000);
}
function startStudentTimers() {
  stopStudentTimers();
  S.timers.push(setInterval(updateTimer, 500), setInterval(heartbeat, 15000));
  window.addEventListener('beforeunload', onBeforeUnload);
  window.addEventListener('blur', onBlur); window.addEventListener('focus', endLeave);
  document.addEventListener('visibilitychange', onVis); document.addEventListener('paste', onPaste, true); document.addEventListener('drop', onPaste, true); document.addEventListener('focusin', onFocusIn, true);
}
function stopStudentTimers() {
  S.timers.forEach(clearInterval); S.timers = [];
  window.removeEventListener('beforeunload', onBeforeUnload);
  window.removeEventListener('blur', onBlur); window.removeEventListener('focus', endLeave);
  document.removeEventListener('visibilitychange', onVis); document.removeEventListener('paste', onPaste, true); document.removeEventListener('drop', onPaste, true); document.removeEventListener('focusin', onFocusIn, true);
}
function onBlur() { startLeave('blur'); }
function onVis() { if (document.hidden) { startLeave('hidden'); if (live()) saveNow(); } else endLeave(); }

/* ============ 엑셀(.xlsx) 파일 생성기 (외부 라이브러리 없음) ============
   - 서식(글꼴·테두리·배경·병합·열 너비·인쇄 설정)과 수식을 지원하는 최소 구현
   - 사용: XlsxLite.build([{ name, cols:[너비...], rows:[[셀...]], merges:['A1:A3'], heights:{1:23}, page:{ orientation:'portrait', fitWidth:true } }]) → Uint8Array
   - 셀: null | 문자열 | 숫자 | { v:값, f:'SUM(D4:D8)', s:{ font:{sz,b,color}, fill:'E5E5E5', border:{l,r,t,b:'thin'|'medium'}, h:'center', v:'center', wrap:true, fmt:'0.0' } } */
const XlsxLite = (() => {
  const enc = new TextEncoder();
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  /* 압축 없이 저장하는 ZIP */
  function zip(files) {
    const parts = [], central = []; let off = 0;
    const DT = 0, DD = ((2026 - 1980) << 9) | (1 << 5) | 1;
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, DT, true); lh.setUint16(12, DD, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);

  const snd = h('input', { type: 'checkbox', checked: MON.sound });
  snd.addEventListener('change', () => { MON.sound = snd.checked; if (snd.checked) { try { MON.ac = MON.ac || new (window.AudioContext || window.webkitAudioContext)(); MON.ac.resume && MON.ac.resume(); beep(); } catch (e) { /* 무시 */ } } });
  const big = h('input', { type: 'checkbox', checked: MON.big }); big.addEventListener('change', () => { MON.big = big.checked; grid.classList.toggle('big', MON.big); });
  grid.classList.toggle('big', MON.big);
  box.append(h('div', { class: 'panel' },
    h('div', { class: 'ge-row' }, h('b', null, '실시간 감독'), netChip, h('span', { style: { color: 'var(--mute)', fontSize: '12.5px' } }, '3초마다 자동 갱신 · 이 탭을 열어 둔 동안 경고가 표시됩니다'),
      h('span', { class: 'sp', style: { flex: 1 } }), h('label', { style: { fontSize: '13px' } }, snd, ' 경고음'), h('label', { style: { fontSize: '13px' } }, big, ' 큰 카드'), sortSel),
    clsBar, sumBar),
    h('div', { class: 'mon-wrap' }, grid, h('div', { class: 'panel mlogp' }, h('div', { class: 'ge-row' }, h('b', null, '경고·활동 기록'), h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { MON.logs = []; draw(); } }, '지우기')), logBox)));

  function draw() {
    if (!data) return;
    const nowSrv = Date.parse(data.server_now); const all = data.rows;
    const classes = [...new Set(all.map((r) => r.class_no))].sort((a, b) => a - b);
    if (MON.cls && !classes.includes(+MON.cls)) MON.cls = '';
    clsBar.replaceChildren(h('button', { class: 'tab' + (!MON.cls ? ' on' : ''), type: 'button', onclick: () => { MON.cls = ''; draw(); } }, `전체 (${all.length})`),
      ...classes.map((c) => {
        const rs = all.filter((r) => r.class_no === c); const aw = rs.filter((r) => r.status !== 'submitted' && (r.presence || {}).away).length;
        return h('button', { class: 'tab' + (String(MON.cls) === String(c) ? ' on' : ''), type: 'button', onclick: () => { MON.cls = String(c); draw(); } }, `${c}반 (${rs.length})`, aw ? h('span', { class: 'chip r', style: { marginLeft: '6px' } }, '이탈 ' + aw) : null);
      }));
    let rows = all.filter((r) => !MON.cls || String(r.class_no) === String(MON.cls));
    const states = rows.map((r) => monState(r, nowSrv).k);
    sumBar.replaceChildren(h('span', { class: 'chip b' }, `풀이 중 ${states.filter((k) => k === 'ok').length}`), h('span', { class: 'chip g' }, `제출 ${states.filter((k) => k === 'done').length}`),
      h('span', { class: 'chip r' }, `이탈 중 ${states.filter((k) => k === 'away').length}`), h('span', { class: 'chip y' }, `응답 없음 ${states.filter((k) => k === 'lost').length}`),
      h('span', { class: 'chip y' }, `누적 이탈 ${rows.reduce((a, r) => a + r.leave_count, 0)}`), h('span', { class: 'chip y' }, `누적 붙여넣기 ${rows.reduce((a, r) => a + r.paste_count, 0)}`),
      h('span', { style: { color: 'var(--mute)', fontSize: '12.5px' } }, '갱신 ' + hhmmss(new Date())));
    const warnN = (r) => r.leave_count + r.paste_count * 2;
    if (MON.sort === 'warn') rows = rows.slice().sort((a, b) => warnN(b) - warnN(a) || a.student_no.localeCompare(b.student_no));
    else if (MON.sort === 'slow') rows = rows.slice().sort((a, b) => (a.status === 'submitted') - (b.status === 'submitted') || a.answered - b.answered);
    else if (MON.sort === 'away') rows = rows.slice().sort((a, b) => ((b.presence || {}).away && b.status !== 'submitted' ? 1 : 0) - ((a.presence || {}).away && a.status !== 'submitted' ? 1 : 0) || a.student_no.localeCompare(b.student_no));
    grid.replaceChildren(...rows.map((r) => monCard(r, nowSrv, () => openDetail(r.id, null))));
    if (!rows.length) grid.append(h('div', { class: 'msg info', style: { gridColumn: '1/-1' } }, '응시 중인 학생이 아직 없습니다. 학생이 입장하면 여기에 표시됩니다.'));
    const logs = MON.logs.filter((l) => !MON.cls || String(l.cls) === String(MON.cls));
    logBox.replaceChildren(...(logs.length ? logs.slice(0, 80).map((l) => h('div', { class: 'lg ' + l.type }, h('span', { class: 'lt' }, hhmmss(new Date(l.t))), h('b', null, `${l.name}`), h('span', { class: 'lno' }, `${l.cls}반 ${String(l.no).slice(3)}번`), h('div', { class: 'ltx' }, (l.type === 'leave' || l.type === 'paste' ? '⚠ ' : '') + l.text))) : [h('div', { style: { color: 'var(--mute)', fontSize: '13px' } }, '아직 기록이 없습니다.')]));
  }
  const poll = async () => {
    try { const r = await tcall('t_monitor'); data = r; MON.ok = true; netChip.className = 'chip g'; netChip.textContent = '연결됨'; monIngest(r); draw(); }
    catch (e) { if (e.message === '로그인 만료') return; netChip.className = 'chip r'; netChip.textContent = '연결 끊김 — 재시도 중'; }
  };
  await poll();
  T.timer = setInterval(() => { if (T.tab === 'monitor') poll(); }, 3000);
}

/* ============ 시작 ============ */
function route() {
  if (location.hash === '#teacher') { if (live()) { toast('시험 중에는 교사 화면으로 이동할 수 없습니다.'); history.replaceState(null, '', location.pathname + location.search); return; } renderTeacher(); }
  else { if (live()) return; clearInterval(T.timer); if (/^#1$/.test(location.hash)) renderLogin(); else renderHome(); }
}
window.addEventListener('hashchange', route);
route();

</script>
</body>
